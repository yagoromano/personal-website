<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A hand of UNO-style cards held by a language model">
  <rect width="640" height="360" fill="#12151b"/>

  <!-- fanned cards -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2">
    <g transform="rotate(-16 320 340)">
      <rect x="240" y="130" width="96" height="140" rx="12" fill="#c0392b"/>
      <ellipse cx="288" cy="200" rx="34" ry="48" fill="#e6e8eb" opacity="0.92" transform="rotate(24 288 200)"/>
      <text x="288" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#c0392b">7</text>
    </g>
    <g transform="rotate(-2 320 340)">
      <rect x="272" y="118" width="96" height="140" rx="12" fill="#2563eb"/>
      <ellipse cx="320" cy="188" rx="34" ry="48" fill="#e6e8eb" opacity="0.92" transform="rotate(24 320 188)"/>
      <text x="320" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#2563eb">2</text>
    </g>
    <g transform="rotate(13 320 340)">
      <rect x="304" y="126" width="96" height="140" rx="12" fill="#16a34a"/>
      <ellipse cx="352" cy="196" rx="34" ry="48" fill="#e6e8eb" opacity="0.92" transform="rotate(24 352 196)"/>
      <text x="352" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#16a34a">+2</text>
    </g>
  </g>

  <!-- model reasoning bubble -->
  <g font-family="ui-monospace, monospace">
    <rect x="410" y="76" width="186" height="86" rx="10" fill="#1a1d23" stroke="#5b8cff" stroke-opacity="0.5"/>
    <path d="M436 162l-10 20 26-20z" fill="#1a1d23" stroke="#5b8cff" stroke-opacity="0.5"/>
    <text x="426" y="102" font-size="12" fill="#9aa1ab">top card: blue 5</text>
    <text x="426" y="122" font-size="12" fill="#9aa1ab">legal: [B2, R7, G+2]</text>
    <text x="426" y="144" font-size="13" fill="#4ade80">play blue 2 ▸</text>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="15" fill="#e6e8eb">LLM agents at the card table</text>
  <text x="48" y="78" font-family="ui-monospace, monospace" font-size="13" fill="#5b8cff">RLCard · Hugging Face · DeepSpeed</text>
</svg>
