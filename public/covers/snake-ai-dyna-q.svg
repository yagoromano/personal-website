<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Stylized snake game board with a snake path and food">
  <rect width="640" height="360" fill="#12151b"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M40 0V360M80 0V360M120 0V360M160 0V360M200 0V360M240 0V360M280 0V360M320 0V360M360 0V360M400 0V360M440 0V360M480 0V360M520 0V360M560 0V360M600 0V360"/>
    <path d="M0 40H640M0 80H640M0 120H640M0 160H640M0 200H640M0 240H640M0 280H640M0 320H640"/>
  </g>
  <!-- snake body -->
  <g fill="#4ade80">
    <rect x="126" y="246" width="28" height="28" rx="7" opacity="0.45"/>
    <rect x="166" y="246" width="28" height="28" rx="7" opacity="0.55"/>
    <rect x="206" y="246" width="28" height="28" rx="7" opacity="0.65"/>
    <rect x="246" y="246" width="28" height="28" rx="7" opacity="0.75"/>
    <rect x="246" y="206" width="28" height="28" rx="7" opacity="0.82"/>
    <rect x="246" y="166" width="28" height="28" rx="7" opacity="0.9"/>
    <rect x="286" y="166" width="28" height="28" rx="7" opacity="0.95"/>
    <rect x="326" y="166" width="28" height="28" rx="7"/>
  </g>
  <!-- eye on head -->
  <circle cx="347" cy="176" r="3.5" fill="#12151b"/>
  <!-- food -->
  <circle cx="460" cy="180" r="11" fill="#f87171"/>
  <circle cx="460" cy="180" r="18" fill="none" stroke="#f87171" stroke-opacity="0.35" stroke-width="2"/>
  <!-- planned path dots toward food -->
  <g fill="#5b8cff" opacity="0.7">
    <circle cx="380" cy="180" r="4"/>
    <circle cx="404" cy="180" r="4"/>
    <circle cx="428" cy="180" r="4"/>
  </g>
  <!-- Q-value hint -->
  <g font-family="ui-monospace, monospace" font-size="14" fill="#9aa1ab">
    <text x="40" y="52">Q(s,a) += α(r + γ maxQ(s',a') − Q(s,a))</text>
    <text x="40" y="76" fill="#5b8cff">planning steps: 50</text>
  </g>
</svg>
